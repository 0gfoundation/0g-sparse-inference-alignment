# Build, sign, and release the sia-0gm35b image.
#
# What this does, in order: build the image from Dockerfile.0gm35b -> push to
# ghcr.io -> sign the pushed digest with cosign (keyless, via this workflow's
# own GitHub OIDC token — no stored signing key) -> emit a SLSA build
# provenance attestation naming the exact commit -> verify both -> publish a
# GitHub Release naming the image, digest, and how to verify it.
#
# Why the provenance attestation, specifically: cosign's signature alone
# proves "this digest was signed by 0gfoundation/0g-sparse-inference-
# alignment's CI" (via the Fulcio certificate identity), but does NOT by
# itself give an independently-checkable link to one exact commit — cosign
# verify only pins the repo + workflow + triggering ref. The provenance
# attestation is the separate, additionally-signed statement that closes
# that gap. This mirrors 0g-serving-broker's own documented verification
# chain (doc/attestation-trust-chain.md, premise N6.4), which spells out two
# separate `cosign` invocations to get from a content hash to a specific
# commit — not one. Skipping this step would leave "which commit built this
# digest" unverifiable by anyone outside 0G, which was the exact gap this CI
# was added to close.
#
# Prerequisites:
#   1. This repo must be public — the verification below is only meaningful
#      if anyone can go read the source at the commit it names.
#   2. Repo Settings -> Actions -> General -> Workflow permissions must
#      allow "Read and write permissions" (needed to push to ghcr.io and to
#      create the Release).
#   3. The FIRST time this runs, go check that the pushed ghcr.io package is
#      actually PUBLIC — a package's visibility is separate from the repo's
#      and does not automatically inherit it. Anonymous check (no login
#      needed):
#        curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:0gfoundation/sia-0gm35b:pull" \
#          | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])" > /tmp/t
#        curl -s -o /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $(cat /tmp/t)" \
#          "https://ghcr.io/v2/0gfoundation/sia-0gm35b/tags/list"
#      200 = public and pullable by anyone. 401/403 = still private — go to
#      the package's own Settings (not the repo's) -> Danger Zone -> Change
#      visibility -> Public. GITHUB_TOKEN cannot flip this itself.
#
# Disk space, checked empirically before writing this: the base image alone
# (pytorch/pytorch:2.11.0-cuda12.8-cudnn9-devel) is ~14GB compressed, and a
# standard GitHub-hosted ubuntu-latest runner only has ~14GB free — before
# even adding the vllm/torch venv this Dockerfile installs on top. The build
# step below reclaims disk first (removes preinstalled Android SDK/.NET/GHC/
# tool-cache, none of which this build needs) for exactly that reason; if it
# still runs out, the fix is a larger hosted runner, not more cleanup.
#
# Release flow once this is merged: merge to main as usual, then
#   git tag v0.18.0 && git push --tags
# CI does the rest — do not hand-build and hand-push this image anymore.
#
# IMPORTANT: this only proves who built a given DIGEST, from which commit.
# It does not stop someone from later re-pushing a different image under the
# same tag (tags are mutable; digests are not). Any deploy config that
# references this image (e.g. docker-compose.0gm35b.yml's
# `image: sia-0gm35b:0.18.0`) should eventually move to pinning the digest,
# not the tag — that is a separate, follow-up change, not done here.

name: Build, Sign and Release

on:
  push:
    tags: [ 'v*' ]

env:
  REGISTRY: ghcr.io
  # Kept as sia-0gm35b (not github.repository) to match the name already
  # referenced in docker-compose.0gm35b.yml (image: sia-0gm35b:0.18.0).
  IMAGE_NAME: 0gfoundation/sia-0gm35b
  DOCKERFILE: Dockerfile.0gm35b

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to create the GitHub Release
      packages: write       # to push to ghcr.io
      id-token: write       # cosign's keyless OIDC signing needs this
      attestations: write   # SLSA build provenance attestation needs this

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Free disk space (CUDA base image alone is ~14GB, runner default is ~14GB free)
      run: |
        echo "Before:" && df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY" || true
        sudo docker image prune -a -f || true
        echo "After:" && df -h /

    - name: Log in to Container Registry
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ env.DOCKERFILE }}
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      # Plain `docker build` + `docker push` hit a known ghcr.io failure mode:
      # when a layer's content hash happens to already exist under some
      # unrelated package (cross-repo blob mount, "Mounted from ..."), the
      # classic push client tries to reuse it rather than re-upload, and if
      # this token lacks read access to that unrelated package the mount is
      # refused with "unknown blob" instead of falling back to a real upload.
      # buildx's push path doesn't hit this. It also gives us the digest
      # directly as a step output — no more manual `docker inspect` parsing.

    - name: Set image_url output
      id: image
      run: echo "image_url=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

    - name: Sign container image with cosign
      run: |
        # Keyless: cosign uses this job's own GitHub OIDC token (granted by
        # `id-token: write` above) to get a short-lived signing cert whose
        # identity is "this repo, this workflow, this triggering ref" — the
        # signature and cert are published to the public Sigstore
        # transparency log. No long-lived signing key exists to leak. This
        # step alone proves WHO built the digest, not which exact commit —
        # see the next step for that.
        cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

    - name: Generate SLSA provenance attestation
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v1.3.0
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

    - name: Verify signature and provenance
      run: |
        # Two independent checks — both required to go from a content hash to
        # a specific, publicly-readable commit (see the header comment).
        cosign verify \
          --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

        cosign verify-attestation --type slsaprovenance1 \
          --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
          --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
          "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" \
          > /dev/null

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2.3.2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Built Image
          **Image:** `${{ steps.image.outputs.image_url }}`
          **Digest:** `${{ steps.push.outputs.digest }}`

          ✅ **Signed with Sigstore cosign**
          ✅ **SLSA Build Provenance attached** (names the exact commit this digest was built from)

          🔍 **Verify on Sigstore:** https://search.sigstore.dev/?hash=${{ steps.push.outputs.digest }}

          To verify locally — two commands, per 0g-serving-broker's own
          verification chain (`doc/attestation-trust-chain.md`, N6.4).
          Pinned to the digest above, not the tag — a tag can be
          repointed later; the digest cannot:
          ```
          # 1. This digest was signed by this repo's CI
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

          # 2. Which commit it was built from
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Output build summary
      run: |
        {
          echo "## Published Image"
          echo "**Tag:** \`${{ github.ref_name }}\`"
          echo "**Image:** \`${{ steps.image.outputs.image_url }}\`"
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`"
          echo ""
          echo "✅ **Signed with Sigstore cosign**"
          echo "✅ **SLSA Build Provenance attached**"
        } >> "$GITHUB_STEP_SUMMARY"
