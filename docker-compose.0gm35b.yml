# Production docker-compose for 0GM-35B SIA b2 inproc.
#
# Pairs with Dockerfile.0gm35b + scripts/docker_entrypoint_0gm35b.sh.
#
# Build + start:
#   docker compose -f docker-compose.0gm35b.yml up --build -d
#   docker compose -f docker-compose.0gm35b.yml logs -f sia-0gm35b
#   docker compose -f docker-compose.0gm35b.yml down

services:
  sia-0gm35b:
    image: sia-0gm35b:0.18.0
    container_name: sia-0gm35b-server

    build:
      context: .
      dockerfile: Dockerfile.0gm35b

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    shm_size: 16g
    ipc: host

    ports:
      - "8000:8000"

    volumes:
      - /dstack/persistent/SIA:/workspace
      - vllm-compile-cache-0gm35b:/root/.cache/vllm

    environment:
      # Main LLM: SIA_LLM_CUDAGRAPH not set, defaults to FULL_AND_PIECEWISE
      # (~2x faster than piecewise-only; vllm 0.18.0 does AOT capture, inference only replays)
      # RM: must be none (eager), piecewise cannot be used — under 0.18.0 RM
      # attempts runtime capture when it encounters a new batch_descriptor, triggering RuntimeError
      SIA_RM_CUDAGRAPH: "none"
      SIA_RM_MULTIPROCESS: "0"
      # Chunk b2 RM scoring into groups of this many sessions per call to prevent
      # RM KV-cache OOM at high concurrency (128+ sessions × topk=10 = 1280 prompts at once).
      # Set to 0 to disable chunking (original behavior).
      SIA_RM_BATCH_CHUNK: "8"

    command: >
      python src/sia_vllm_server.py
        --llm        /workspace/models/0GM-1.0-35B-A3B-0427
        --model_id   0GM-1.0-35B-A3B-0427-SIA
        --rm_backend b2
        --rm_model   /workspace/models/VM-Qwen3-4B-merged-for-vllm
        --llm_gpu_mem    0.75
        --rm_b2_gpu_mem  0.20
        --topk 10 --weight 1.0 --entropy_threshold 1.0
        --max_model_len 32768
        --enable_prefix_caching
        --mamba_cache_mode align
        --host 0.0.0.0
        --port 8000

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25m

    stop_grace_period: 30s

volumes:
  vllm-compile-cache-0gm35b:
